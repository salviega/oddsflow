# Compiler settings mirror 1inch/swap-vm v1.0.2, so OddsFlowRouter builds like
# the official AquaSwapVMRouter except for the two added opcodes.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [
	{ access = "read-write", path = "./deployments" },
	{ access = "read-write", path = "../core/src/fixtures" },
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 700
via_ir = true
remappings = [
	"forge-std/=lib/forge-std/src/",
	"@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
	"@1inch/solidity-utils/=lib/solidity-utils/",
	"@1inch/aqua/=lib/aqua/",
	"@1inch/swap-vm/=lib/swap-vm/",
]

[profile.default.optimizer_details]
yul = true
yulDetails = { stackAllocation = true, optimizerSteps = "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul Tpeul]jmul[jul] VcTOcul jmul : fDnTOcmu" }

[rpc_endpoints]
gnosis = "${GNOSIS_RPC_URL}"

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header = "all"
bracket_spacing = true
int_types = "long"
number_underscore = "thousands"
